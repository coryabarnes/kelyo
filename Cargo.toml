[workspace]
resolver = "3"
members = ["crates/kite-core", "crates/kite", "xtask"]
default-members = ["crates/kite-core", "crates/kite"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
kite-core = { path = "crates/kite-core" }
# Rust bindings for the Chromium Embedded Framework (Chromium 156).
# The crate version tracks the CEF version, so bump both together.
cef = { version = "156.4", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
